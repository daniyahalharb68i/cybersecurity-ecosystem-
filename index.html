<title>Saudi Cybersecurity Ecosystem</title>
<style>
:root{box-sizing:border-box;--bg:#f4f7fb;--fg:#0b1b33;--mut:#5a6b85;--line:#c9d4e4;--c0:#0b1b33;--c1:#1d6fe0;--c2:#0f9d7a;--c3:#7a4be0;--c4:#d9822b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070e1c;--fg:#e8eefb;--mut:#8fa2c4;--line:#22345a;--c0:#33e0c0;--c1:#4d93ff;--c2:#2fd2a5;--c3:#a07dff;--c4:#ffa955}}
:root[data-theme="dark"]{--bg:#070e1c;--fg:#e8eefb;--mut:#8fa2c4;--line:#22345a;--c0:#33e0c0;--c1:#4d93ff;--c2:#2fd2a5;--c3:#a07dff;--c4:#ffa955}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#track{height:2100vh;position:relative}
#stage{position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#cap{text-align:center;min-height:92px;padding:10px 16px 0}
#tag{display:inline-block;font-size:13px;font-weight:700;padding:3px 14px;border-radius:99px;border:1px solid var(--c0);color:var(--c0)}
#ttl{font-size:clamp(18px,3.4vw,28px);font-weight:800;margin:6px 0 2px}
#cur{font-size:clamp(14px,2.4vw,18px);color:var(--mut);min-height:26px}
svg{flex:1;min-height:0;width:min(100%,92vh);max-width:100%}
.ring{fill:none;stroke-width:2;stroke-dasharray:5 7;opacity:0;transition:opacity .8s}
.ring.on{opacity:.85}
.n{opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(.2);transition:opacity .5s,transform .6s cubic-bezier(.2,1.4,.4,1)}
.n.on{opacity:1;transform:scale(1)}
.n.act circle,.n.act rect{stroke:var(--fg);stroke-width:3}
.lbl{font-size:15px;font-weight:600;fill:var(--fg);paint-order:stroke;stroke:var(--bg);stroke-width:4px;text-anchor:middle}
.ini{fill:#fff;font-weight:800;text-anchor:middle}
#bar{position:fixed;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--c1),var(--c2),var(--c3),var(--c4));transform-origin:left;transform:scaleX(0);z-index:9}
#hint{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));color:var(--mut);font-size:14px;animation:b 1.6s infinite;transition:opacity .4s}
@keyframes b{50%{transform:translateY(6px)}}
</style></head><body>
